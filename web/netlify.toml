# Netlify site: the public website. Base directory: web
[build]
  publish = "."

# Same-origin API: Netlify forwards these to the API on Render,
# so the login cookie is first-party (Safari blocks third-party cookies).
[[redirects]]
  from = "/api/*"
  to = "https://kundar-travel-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://kundar-travel-api.onrender.com/uploads/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
